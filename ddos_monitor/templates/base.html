<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Anti-DDoS{% endblock %} — Per-Service Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  {% block head_extra %}{% endblock %}
  <style>
    :root {
      --bg:        #0d1117;
      --panel:     #161b22;
      --panel-2:   #1c2128;
      --border:    #30363d;
      --text:      #c9d1d9;
      --text-dim:  #8b949e;
      --accent:    #58a6ff;
      --ph-warmup:     #8b949e;
      --ph-normal:     #3fb950;
      --ph-suspicious: #d29922;
      --ph-attack:     #f85149;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, .mono, .num {
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;
    }
    .num { text-align: right; }

    /* ---- sticky header + nav ---- */
    header.topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 24px;
      padding: 0 20px; height: 52px;
    }
    header.topbar .brand {
      font-weight: 700; font-size: 16px; color: var(--text);
      letter-spacing: 0.3px; white-space: nowrap;
    }
    header.topbar .brand .dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: var(--ph-normal); margin-right: 8px;
    }
    nav.tabs { display: flex; gap: 4px; flex: 1; }
    nav.tabs a {
      padding: 8px 14px; border-radius: 6px; color: var(--text-dim);
      font-weight: 500;
    }
    nav.tabs a:hover { background: var(--panel-2); text-decoration: none; }
    nav.tabs a.active {
      background: var(--panel-2); color: var(--text);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    header.topbar .clock {
      color: var(--text-dim); font-size: 12px; white-space: nowrap;
    }
    header.topbar .clock .live {
      color: var(--ph-normal); font-weight: 600;
    }
    header.topbar .clock .stale { color: var(--ph-attack); font-weight: 600; }

    /* ---- layout ---- */
    main { padding: 20px; max-width: 1600px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px 0; }
    .subtitle { color: var(--text-dim); margin: 0 0 18px 0; font-size: 13px; }

    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px; margin-bottom: 16px;
    }
    .panel h2 {
      font-size: 14px; margin: 0 0 12px 0; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600;
    }

    /* ---- tiles ---- */
    .tile-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    .tile {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px;
    }
    .tile .label {
      color: var(--text-dim); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.6px; margin-bottom: 6px;
    }
    .tile .value {
      font-size: 26px; font-weight: 700;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }
    .tile.warmup     { border-left: 3px solid var(--ph-warmup); }
    .tile.normal     { border-left: 3px solid var(--ph-normal); }
    .tile.suspicious { border-left: 3px solid var(--ph-suspicious); }
    .tile.attack     { border-left: 3px solid var(--ph-attack); }
    .tile.warmup     .value { color: var(--ph-warmup); }
    .tile.normal     .value { color: var(--ph-normal); }
    .tile.suspicious .value { color: var(--ph-suspicious); }
    .tile.attack     .value { color: var(--ph-attack); }

    /* ---- tables ---- */
    table.grid {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    table.grid th, table.grid td {
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      text-align: left;
    }
    table.grid th {
      color: var(--text-dim); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      position: sticky; top: 52px; background: var(--panel);
    }
    table.grid tbody tr:hover { background: var(--panel-2); }
    table.grid tr.clickable { cursor: pointer; }

    /* ---- phase pills ---- */
    .pill {
      display: inline-block; padding: 2px 9px; border-radius: 11px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    }
    .pill.WARMUP     { background: rgba(139,148,158,.18); color: var(--ph-warmup); }
    .pill.NORMAL     { background: rgba(63,185,80,.16);   color: var(--ph-normal); }
    .pill.SUSPICIOUS { background: rgba(210,153,34,.18);  color: var(--ph-suspicious); }
    .pill.ATTACK     { background: rgba(248,81,73,.18);   color: var(--ph-attack); }
    .pill.UNKNOWN    { background: rgba(139,148,158,.18); color: var(--text-dim); }

    /* ---- score bar ---- */
    .scorebar {
      display: inline-block; width: 60px; height: 8px; border-radius: 4px;
      background: var(--panel-2); overflow: hidden; vertical-align: middle;
      margin-right: 6px; border: 1px solid var(--border);
    }
    .scorebar > span { display: block; height: 100%; }
    .score-lo > span { background: var(--ph-normal); }
    .score-mid > span { background: var(--ph-suspicious); }
    .score-hi > span { background: var(--ph-attack); }

    /* ---- misc ---- */
    .controls {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
      align-items: center;
    }
    .controls input, .controls select {
      background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 10px;
      font-size: 13px;
    }
    .controls label { color: var(--text-dim); font-size: 12px; }
    .empty {
      color: var(--text-dim); padding: 30px; text-align: center;
      font-style: italic;
    }
    .err {
      color: var(--ph-attack); background: rgba(248,81,73,.10);
      border: 1px solid rgba(248,81,73,.4); border-radius: 6px;
      padding: 10px 14px; margin-bottom: 14px;
    }
    details { margin-top: 8px; }
    details summary {
      cursor: pointer; color: var(--text-dim); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px; user-select: none;
    }
    pre.json {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; overflow-x: auto;
      font-size: 12px; max-height: 480px;
    }
    .kv-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
      gap: 4px 18px;
    }
    .kv-grid .k { color: var(--text-dim); }
    .kv-grid .v { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .chart-box { position: relative; height: 240px; }
    .arrow { color: var(--text-dim); padding: 0 4px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Anti-DDoS &middot; Per-Service</div>
    <nav class="tabs">
      <a href="/"         class="{{ 'active' if active_tab == 'overview' else '' }}">Overview</a>
      <a href="/services" class="{{ 'active' if active_tab == 'services' else '' }}">Services</a>
      <a href="/registry" class="{{ 'active' if active_tab == 'registry' else '' }}">Registry</a>
      <a href="/alerts"   class="{{ 'active' if active_tab == 'alerts' else '' }}">Alerts</a>
    </nav>
    <div class="clock" id="topclock">&mdash;</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    // ---- shared helpers, available to every page ----
    const REFRESH_MS = {{ config.DASHBOARD_REFRESH_SECONDS * 1000 }};
    const PHASE_NAMES = {0: "WARMUP", 1: "NORMAL", 2: "SUSPICIOUS", 3: "ATTACK"};

    function phasePill(name) {
      const safe = (name || "UNKNOWN").toUpperCase();
      const known = ["WARMUP", "NORMAL", "SUSPICIOUS", "ATTACK"];
      const cls = known.includes(safe) ? safe : "UNKNOWN";
      return `<span class="pill ${cls}">${safe}</span>`;
    }
    function scoreBar(v) {
      const pct = Math.max(0, Math.min(1, Number(v) || 0)) * 100;
      let cls = "score-lo";
      if (v >= 0.7) cls = "score-hi";
      else if (v >= 0.4) cls = "score-mid";
      return `<span class="scorebar ${cls}"><span style="width:${pct}%"></span></span>`
           + `<span class="mono">${(Number(v)||0).toFixed(3)}</span>`;
    }
    function fmtNum(v) {
      if (v === null || v === undefined) return "—";
      return Number(v).toLocaleString("en-US");
    }
    function fmtBytes(v) {
      v = Number(v) || 0;
      const u = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return v.toFixed(i ? 1 : 0) + " " + u[i];
    }
    function fmtTs(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString("en-US", { hour12: false });
    }
    // Catchall slots carry port=0 and proto_kind_str="CATCHALL_<PROTO>" in
    // the raw API. These two display helpers present them cleanly in the UI
    // (port "Any", proto "<PROTO>") without touching the underlying data.
    function fmtPort(port, isCatchall) {
      return isCatchall ? "Any" : String(port);
    }
    function fmtProto(protoKindStr) {
      if (!protoKindStr) return "?";
      switch (protoKindStr) {
        case "CATCHALL_TCP":   return "TCP";
        case "CATCHALL_UDP":   return "UDP";
        case "CATCHALL_ICMP":  return "ICMP";
        case "CATCHALL_OTHER": return "Other";
        default:               return protoKindStr;
      }
    }
    function setClock(iso, ok) {
      const el = document.getElementById("topclock");
      if (!el) return;
      if (!iso) { el.innerHTML = '<span class="stale">no data</span>'; return; }
      const cls = ok === false ? "stale" : "live";
      el.innerHTML = `data&nbsp;<span class="${cls}">${fmtTs(iso)}</span>`;
    }
    async function getJSON(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) {
        let detail = r.statusText;
        try { detail = (await r.json()).error || detail; } catch (e) {}
        throw new Error(`${r.status}: ${detail}`);
      }
      return r.json();
    }
    function showError(containerId, msg) {
      const c = document.getElementById(containerId);
      if (c) c.innerHTML = `<div class="err">Error: ${msg}</div>`;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
