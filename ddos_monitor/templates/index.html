<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
    <style>
        body            { background:#121212; color:#e0e0e0; font-family:'Segoe UI',sans-serif; }
        .navbar         { background:#1f1f1f; border-bottom:1px solid #333; }
        .card           { background:#1e1e1e; border:1px solid #333; margin-bottom:16px;
                          box-shadow:0 4px 6px rgba(0,0,0,.3); }
        .card-header    { background:#252525; border-bottom:1px solid #333;
                          font-weight:600; font-size:.85rem; color:#aaa; }
        .section-head   { font-size:.7rem; letter-spacing:2px; text-transform:uppercase;
                          color:#555; padding:8px 0 4px 4px; margin-top:4px; }

        /* Detection status badge */
        #detectionBadge {
            font-size:1.1rem; font-weight:700; padding:6px 18px;
            border-radius:6px; letter-spacing:1px; transition:all .3s;
        }
        .st-warmup     { background:#0d6efd33; color:#6ea8fe; border:1px solid #0d6efd; }
        .st-normal     { background:#19875433; color:#75b798; border:1px solid #198754; }
        .st-recovering { background:#0dcaf033; color:#6edff6; border:1px solid #0dcaf0; }
        .st-suspicious { background:#ffc10733; color:#ffda6a; border:1px solid #ffc107; }
        .st-attack     { background:#dc354533; color:#ea868f; border:1px solid #dc3545;
                         animation:pulse .8s infinite; }
        @keyframes pulse {
            0%,100% { box-shadow:0 0 0 0 #dc354566; }
            50%      { box-shadow:0 0 0 8px #dc354500; }
        }

        /* Score bars (Tier 0 / Tier 1 sub-scores) */
        .score-row      { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
        .score-label    { font-size:.72rem; color:#888; width:110px; flex-shrink:0; }
        .score-bar-wrap { flex:1; background:#2a2a2a; border-radius:3px; height:10px; }
        .score-bar      { height:10px; border-radius:3px; transition:width .4s; }
        .score-val      { font-size:.72rem; color:#aaa; width:38px; text-align:right; }

        /* Warmup progress */
        #warmupRow      { font-size:.75rem; color:#666; display:none; }

        /* Charts */
        canvas          { max-height:200px; }
        select.form-select { background:#2c2c2c; color:#fff; border:1px solid #444; }
        .chart-tier-label { font-size:.65rem; letter-spacing:1px;
                            text-transform:uppercase; color:#555; }
    </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark mb-3">
    <div class="container-fluid">
        <span class="navbar-brand">
            <span style="color:#0d6efd">🛡</span> DPDK DDoS Sentinel
        </span>
        <div class="d-flex align-items-center gap-3">
            <label class="text-muted small">Target IP:</label>
            <select id="targetSelect" class="form-select form-select-sm" style="width:200px">
                <option>Loading…</option>
            </select>
        </div>
    </div>
</nav>

<div class="container-fluid">

    <!-- DEBUG PANEL (remove after fixing) -->
    <div class="row mb-2">
        <div class="col-12">
            <div class="card" style="border-color:#dc3545;">
                <div class="card-body p-2">
                    <div style="font-family:monospace;font-size:11px;color:#ffc107;">
                        <strong>DEBUG:</strong>
                        <span id="debugStatus">Waiting for data...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Status row ──────────────────────────────────────────────────── -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="card">
                <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">

                    <!-- Left: overall status -->
                    <div>
                        <div class="d-flex align-items-center gap-3">
                            <span id="detectionBadge" class="st-warmup">WARMUP</span>
                            <div>
                                <div class="small text-muted" id="lastUpdated">Waiting…</div>
                                <div id="warmupRow" class="mt-1">
                                    Warm-up:
                                    <span id="warmupBar" style="color:#0d6efd">·</span>
                                    <span id="warmupVal"></span> windows remaining
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: per-tier score bars -->
                    <div style="min-width:280px">
                        <div class="score-row">
                            <span class="score-label">Tier 0 (volume)</span>
                            <div class="score-bar-wrap">
                                <div class="score-bar" id="bar-t0" style="width:0%;background:#0d6efd"></div>
                            </div>
                            <span class="score-val" id="val-t0">—</span>
                        </div>
                        <div class="score-row">
                            <span class="score-label">Tier 1.1 (TCP)</span>
                            <div class="score-bar-wrap">
                                <div class="score-bar" id="bar-tcp" style="width:0%;background:#dc3545"></div>
                            </div>
                            <span class="score-val" id="val-tcp">—</span>
                        </div>
                        <div class="score-row">
                            <span class="score-label">Tier 1.2 (UDP)</span>
                            <div class="score-bar-wrap">
                                <div class="score-bar" id="bar-udp" style="width:0%;background:#ffc107"></div>
                            </div>
                            <span class="score-val" id="val-udp">—</span>
                        </div>
                        <div class="score-row">
                            <span class="score-label">Tier 1.3 (ICMP)</span>
                            <div class="score-bar-wrap">
                                <div class="score-bar" id="bar-icmp" style="width:0%;background:#adb5bd"></div>
                            </div>
                            <span class="score-val" id="val-icmp">—</span>
                        </div>
                        <div class="score-row">
                            <span class="score-label">Tier 1.4 (Dist)</span>
                            <div class="score-bar-wrap">
                                <div class="score-bar" id="bar-dist" style="width:0%;background:#20c997"></div>
                            </div>
                            <span class="score-val" id="val-dist">—</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ── Live Traffic Stats ────────────────────────────────────────────── -->
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body p-3">
                    <div style="font-size:11px;color:#888;text-transform:uppercase;margin-bottom:4px;letter-spacing:0.5px;">
                        Packets/sec
                    </div>
                    <div style="font-size:28px;font-weight:600;color:#0d6efd;" id="livePPS">—</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body p-3">
                    <div style="font-size:11px;color:#888;text-transform:uppercase;margin-bottom:4px;letter-spacing:0.5px;">
                        Bits/sec
                    </div>
                    <div style="font-size:28px;font-weight:600;color:#0d6efd;" id="liveBPS">—</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body p-3">
                    <div style="font-size:11px;color:#888;text-transform:uppercase;margin-bottom:4px;letter-spacing:0.5px;">
                        Flows/sec (HLL)
                    </div>
                    <div style="font-size:28px;font-weight:600;color:#0d6efd;" id="liveFPS">—</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Charts ──────────────────────────────────────────────────────── -->
    <div id="chartsContainer" class="row"></div>

</div><!-- /container -->

<script>
// ============================================================================
// METRIC DEFINITIONS — exactly mirrors the new CSV schema
// ============================================================================

const TIER_COLOR = {
    '0':   '#0d6efd',   // blue   — volume
    '1.1': '#dc3545',   // red    — TCP
    '1.2': '#ffc107',   // yellow — UDP
    '1.3': '#adb5bd',   // grey   — ICMP
    '1.4': '#20c997',   // teal   — distribution
};

const EWMA_COLOR = '#ff9944';   // amber — same for all EWMA baseline lines

const METRICS = [
    // ── Tier 0: Volume ─────────────────────────────────────────────────
    { tier:'0', label:'PPS',            key:'pps',              em:'em_pps' },
    { tier:'0', label:'BPS',            key:'bps',              em:'em_bps' },
    { tier:'0', label:'FPS (HLL)',       key:'fps',              em:'em_fps' },
    { tier:'0', label:'Burst (PPS)',     key:'burst_pps',        em:'em_burst_pps' },
    { tier:'0', label:'Burst (BPS)',     key:'burst_bps',        em:'em_burst_bps' },
    { tier:'0', label:'Burst (FPS)',     key:'burst_fps',        em:'em_burst_fps' },

    // ── Tier 1.1: TCP ──────────────────────────────────────────────────
    { tier:'1.1', label:'SYN/TCP',        key:'tcp_syn_ratio',      em:'em_tcp_syn_ratio' },
    { tier:'1.1', label:'SYN-ACK/TCP',    key:'tcp_synack_ratio',   em:'em_tcp_synack_ratio' },
    { tier:'1.1', label:'FIN-ACK/TCP',    key:'tcp_finack_ratio',   em:'em_tcp_finack_ratio' },
    { tier:'1.1', label:'RST/TCP',        key:'tcp_rst_ratio',      em:'em_tcp_rst_ratio' },
    { tier:'1.1', label:'ACK-Data/TCP',   key:'tcp_ack_data_ratio', em:'em_tcp_ack_data_ratio' },
    { tier:'1.1', label:'TCP PPS/Total',  key:'tcp_pps_ratio',      em:'em_tcp_pps_ratio' },
    { tier:'1.1', label:'TCP BPS/Total',  key:'tcp_bps_ratio',      em:'em_tcp_bps_ratio' },

    // ── Tier 1.2: UDP ──────────────────────────────────────────────────
    { tier:'1.2', label:'UDP BPS/Total',  key:'udp_bps_ratio',      em:'em_udp_bps_ratio' },
    { tier:'1.2', label:'UDP PPS/Total',  key:'udp_pps_ratio',      em:'em_udp_pps_ratio' },
    { tier:'1.2', label:'UDP Flows/PPS',  key:'udp_flow_ratio',     em:'em_udp_flow_ratio' },

    // ── Tier 1.3: ICMP ─────────────────────────────────────────────────
    { tier:'1.3', label:'ICMP Echo Rate', key:'icmp_echo_ratio',    em:'em_icmp_echo_ratio' },
    { tier:'1.3', label:'ICMP PPS/Total', key:'icmp_pps_ratio',     em:'em_icmp_pps_ratio' },

    // ── Tier 1.4: Distribution ─────────────────────────────────────────
    { tier:'1.4', label:'Src IPs/PPS',   key:'src_ip_ratio',        em:'em_src_ip_ratio' },
    { tier:'1.4', label:'Dst Ports/PPS', key:'dst_port_ratio',      em:'em_dst_port_ratio' },
];

const API_BASE = '/api';
let currentTarget = null;
let charts        = {};

// ============================================================================
// BUILD CHART GRID
// ============================================================================

function buildGrid() {
    const container = document.getElementById('chartsContainer');
    container.innerHTML = '';

    let currentTier = null;

    METRICS.forEach(m => {
        // Insert a full-width tier label when tier changes
        if (m.tier !== currentTier) {
            currentTier = m.tier;
            const headRow = document.createElement('div');
            headRow.className = 'col-12';
            headRow.innerHTML = `
                <div class="section-head" style="color:${TIER_COLOR[m.tier]}">
                    ◆ Tier ${m.tier}
                </div>`;
            container.appendChild(headRow);
        }

        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4 col-xl-3';

        const color = TIER_COLOR[m.tier];
        col.innerHTML = `
            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <span>${m.label}</span>
                    <span class="chart-tier-label" style="color:${color}">Tier ${m.tier}</span>
                </div>
                <div class="card-body p-2">
                    <canvas id="chart_${m.key}"></canvas>
                </div>
            </div>`;
        container.appendChild(col);
    });
}

// ============================================================================
// CHART CREATION (dual-line: raw + EWMA mean)
// ============================================================================

function makeChart(canvasId, rawColor) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) {
        console.error(`[makeChart] Canvas element #${canvasId} not found`);
        return null;
    }

    try {
        return new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Real-time',
                        data: [],
                        borderColor: rawColor,
                        borderWidth: 1.8,
                        tension: 0.35,
                        pointRadius: 0,
                        fill: false,
                    },
                    {
                        label: 'EWMA baseline',
                        data: [],
                        borderColor: EWMA_COLOR,
                        borderWidth: 2,
                        borderDash: [6, 3],
                        tension: 0.35,
                        pointRadius: 0,
                        fill: false,
                    },
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { mode:'index', intersect:false },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: true },
                },
                scales: {
                    x: {
                        type: 'time',
                        time: { unit:'second', displayFormats:{ second:'HH:mm:ss' } },
                        ticks: { display: false },
                        grid: { color:'#222' },
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color:'#222' },
                        ticks: { color:'#888', font:{ size:10 } },
                    },
                },
            },
        });
    } catch (err) {
        console.error(`[makeChart] Chart.js threw error for ${canvasId}:`, err);
        return null;
    }
}

// ============================================================================
// TARGET SELECTOR
// ============================================================================


// ============================================================================
// TARGET SELECTOR
// ============================================================================

/*
 * knownIPs — the exact list currently rendered in the <select>.
 * By comparing against this before every rebuild we can skip the DOM write
 * entirely when nothing changed, so a background poll can never reset the
 * visual selection.
 */
let knownIPs = [];

async function fetchTargets() {
    try {
        const r   = await fetch(`${API_BASE}/targets`);
        const ips = await r.json();
        if (!Array.isArray(ips) || !ips.length) return;

        /* Only touch the DOM when the list of IPs actually changed */
        const newKey = ips.slice().sort().join('|');
        const oldKey = knownIPs.slice().sort().join('|');
        if (newKey === oldKey) return;   /* nothing changed — leave <select> alone */

        knownIPs = ips.slice();
        const sel = document.getElementById('targetSelect');

        /* Snapshot the current selection BEFORE wiping */
        const previous = currentTarget || sel.value;

        /* Rebuild options */
        sel.innerHTML = '';
        ips.forEach(ip => {
            const o = document.createElement('option');
            o.value = ip;
            o.text  = ip;
            sel.appendChild(o);
        });

        /* Restore the previous selection if it still exists, else pick first */
        const toSelect = ips.find(ip => ip === previous) || ips[0];
        sel.value     = toSelect;
        currentTarget = toSelect;

    } catch (e) { console.error('fetchTargets:', e); }
}

document.getElementById('targetSelect').addEventListener('change', e => {
    currentTarget = e.target.value;
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
});


// ============================================================================
// SCORE BAR HELPER
// ============================================================================

function setScoreBar(barId, valId, score, active) {
    const pct  = active ? (score * 100).toFixed(1) : 0;
    const text = active ? score.toFixed(3) : '—';
    const bar  = document.getElementById(barId);
    const val  = document.getElementById(valId);
    if (!bar || !val) return;
    bar.style.width = pct + '%';
    val.textContent = text;

    /* Colour: green → yellow → red based on score */
    let col = '#198754';
    if (score >= 0.6) col = '#dc3545';
    else if (score >= 0.4) col = '#ffc107';
    bar.style.background = col;
}

// ============================================================================
// STATUS PANEL
// ============================================================================

function updateStatus(rec) {
    /* Timestamp */
    const ts = new Date(rec.timestamp);
    document.getElementById('lastUpdated').textContent =
        'Last update: ' + ts.toLocaleTimeString();

    /* Live traffic stats — format with K/M/G suffixes */
    const formatNumber = (n) => {
        if (n >= 1e9) return (n / 1e9).toFixed(2) + ' G';
        if (n >= 1e6) return (n / 1e6).toFixed(2) + ' M';
        if (n >= 1e3) return (n / 1e3).toFixed(2) + ' K';
        return n.toFixed(0);
    };

    document.getElementById('livePPS').textContent = formatNumber(rec.pps || 0);
    document.getElementById('liveBPS').textContent = formatNumber(rec.bps || 0);
    document.getElementById('liveFPS').textContent = formatNumber(rec.fps || 0);

    /* Detection state badge */
    const badge = document.getElementById('detectionBadge');
    const state = (rec.detection_state || 'UNKNOWN').toUpperCase();
    badge.textContent = state;
    badge.className   = '';   /* reset */
    const cls = {
        WARMUP:     'st-warmup',
        NORMAL:     'st-normal',
        RECOVERING: 'st-recovering',
        SUSPICIOUS: 'st-suspicious',
        ATTACK:     'st-attack',
    }[state] || 'st-warmup';
    badge.classList.add(cls);

    /* Warm-up progress */
    const wr = rec.warmup_remaining || 0;
    const warmupRow = document.getElementById('warmupRow');
    if (state === 'WARMUP' && wr > 0) {
        warmupRow.style.display = 'block';
        document.getElementById('warmupVal').textContent = wr;
        /* Progress bar — handles any warmup window count (not hardcoded to 30) */
        const total  = 300;   /* matches DETECTION_WARMUP_WINDOWS in C code */
        const filled = Math.max(0, total - wr);   /* clamp to 0 if wr > total */
        const remain = Math.min(wr, total);       /* clamp to total if wr > total */
        /* Cap the bar width to avoid overly long strings */
        const barWidth = 40;
        const fillPct  = filled / total;
        const fillBars = Math.floor(fillPct * barWidth);
        const emptyBars = barWidth - fillBars;
        document.getElementById('warmupBar').textContent =
            '█'.repeat(fillBars) + '░'.repeat(emptyBars);
    } else {
        warmupRow.style.display = 'none';
    }

    /* Score bars */
    const t1ev = rec.tier1_evaluated;
    setScoreBar('bar-t0',   'val-t0',   rec.tier0_score        || 0, true);
    setScoreBar('bar-tcp',  'val-tcp',  rec.tier1_tcp_score    || 0, t1ev);
    setScoreBar('bar-udp',  'val-udp',  rec.tier1_udp_score    || 0, t1ev);
    setScoreBar('bar-icmp', 'val-icmp', rec.tier1_icmp_score   || 0, t1ev);
    setScoreBar('bar-dist', 'val-dist', rec.tier1_dist_score   || 0, t1ev);
}

// ============================================================================
// CHART UPDATE
// ============================================================================

function updateCharts(data) {
    /* Parse timestamps with fallback for different formats */
    const labels = data.map(d => {
        const ts = d.timestamp;
        if (typeof ts === 'number') return new Date(ts);
        if (typeof ts === 'string') return new Date(ts);
        /* datetime object serialized as ISO string */
        if (ts instanceof Date) return ts;
        console.error('[updateCharts] Invalid timestamp:', ts);
        return new Date();
    });

    console.log(`[updateCharts] Processing ${data.length} records`);
    console.log(`[updateCharts] First timestamp raw:`, data[0]?.timestamp, '→', labels[0]);
    console.log(`[updateCharts] Last timestamp raw:`, data[data.length - 1]?.timestamp, '→', labels[labels.length - 1]);

    let createdCount = 0;
    let updatedCount = 0;

    METRICS.forEach(m => {
        const rawColor = TIER_COLOR[m.tier];
        const rawArr   = data.map(d => d[m.key]  ?? 0);
        const emArr    = data.map(d => d[m.em]   ?? 0);

        if (charts[m.key]) {
            const c = charts[m.key];
            c.data.labels           = labels;
            c.data.datasets[0].data = rawArr;
            c.data.datasets[1].data = emArr;
            c.update('none');
            updatedCount++;
        } else {
            const ctx = document.getElementById(`chart_${m.key}`);
            if (!ctx) {
                console.error(`[updateCharts] ✗ Canvas #chart_${m.key} NOT FOUND in DOM`);
                return;
            }

            charts[m.key] = makeChart(`chart_${m.key}`, rawColor);
            if (charts[m.key]) {
                charts[m.key].data.labels           = labels;
                charts[m.key].data.datasets[0].data = rawArr;
                charts[m.key].data.datasets[1].data = emArr;
                charts[m.key].update('none');
                createdCount++;
                console.log(`[updateCharts] ✓ Created ${m.key}: ${rawArr.length} pts, first=${rawArr[0]}, last=${rawArr[rawArr.length-1]}`);
            } else {
                console.error(`[updateCharts] ✗ makeChart() returned NULL for ${m.key}`);
            }
        }
    });

    console.log(`[updateCharts] Summary: ${createdCount} created, ${updatedCount} updated`);
}

// ============================================================================
// MAIN REFRESH LOOP
// ============================================================================

async function refresh() {
    const debugEl = document.getElementById('debugStatus');
    
    if (!currentTarget) {
        debugEl.textContent = '❌ No IP selected';
        debugEl.style.color = '#dc3545';
        return;
    }

    try {
        const url = `${API_BASE}/stats/${currentTarget}`;
        debugEl.textContent = `⏳ Fetching ${url}...`;
        debugEl.style.color = '#ffc107';
        
        const r    = await fetch(url);
        const data = await r.json();

        if (!data || !data.length) {
            debugEl.innerHTML = `❌ Received EMPTY array for ${currentTarget}<br>` +
                `Check: (1) Is DPDK running? (2) Is collector.py receiving data? (3) Does shared_state have records?`;
            debugEl.style.color = '#dc3545';
            console.warn('[Refresh] ⚠ Empty response');
            return;
        }

        const sample = data[data.length - 1];
        debugEl.innerHTML = `✓ ${data.length} records | IP: ${currentTarget} | ` +
            `PPS: ${sample.pps?.toFixed(0) ?? '?'} | ` +
            `State: ${sample.detection_state ?? '?'} | ` +
            `Timestamp: ${sample.timestamp}`;
        debugEl.style.color = '#198754';

        console.log(`[Refresh] ← ${data.length} records`);
        console.log('[Refresh] Sample:', JSON.stringify(sample).substring(0, 300));

        updateStatus(sample);
        updateCharts(data);
    } catch (e) {
        debugEl.textContent = `❌ ERROR: ${e.message}`;
        debugEl.style.color = '#dc3545';
        console.error('[Refresh] ✗ Error:', e);
    }
}

// ============================================================================
// BOOT
// ============================================================================

buildGrid();

/* Initial target load, then poll for new IPs every 5 s */
fetchTargets();
setInterval(fetchTargets, 5000);

/* Data refresh every 1 s — independent of target polling */
setInterval(refresh, 1000);
</script>
</body>
</html>
