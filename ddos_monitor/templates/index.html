<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
    <style>
        :root {
            --fg-bg-main: #0f1419;
            --fg-bg-card: #161b22;
            --fg-bg-header: #1c2128;
            --fg-border: #2a2f36;

            --fg-green: #00d084;
            --fg-amber: #ffb020;
            --fg-red: #ff4d4f;
            --fg-cyan: #00c2ff;
            --fg-purple: #8b5cf6;
        }

        /* Background */
        body {
            background-color: var(--fg-bg-main) !important;
            color: #e6edf3;
        }

        /* Navbar */
        .navbar {
            background-color: var(--fg-bg-header) !important;
            border-bottom: 1px solid var(--fg-border);
        }

        /* Cards */
        .card {
            background-color: var(--fg-bg-card);
            border: 1px solid var(--fg-border);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--fg-cyan);
            box-shadow: 0 0 10px rgba(0, 194, 255, 0.15);
        }

        /* Section Headers */
        h6.text-primary {
            color: var(--fg-cyan) !important;
            border-color: var(--fg-cyan) !important;
        }

        /* HUD Numbers */
        .card-title {
            letter-spacing: 1px;
        }

        /* Status Badge Glow */
        .badge {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-normal {
            background-color: var(--fg-green) !important;
            box-shadow: 0 0 10px rgba(0, 208, 132, 0.4);
        }

        .status-warning {
            background-color: var(--fg-amber) !important;
            color: #000 !important;
            box-shadow: 0 0 10px rgba(255, 176, 32, 0.4);
        }

        .status-danger {
            background-color: var(--fg-red) !important;
            box-shadow: 0 0 10px rgba(255, 77, 79, 0.4);
        }

        /* Chart Grid */
        canvas {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.02),
                    rgba(0, 0, 0, 0.1));
            border-radius: 6px;
        }
    </style>

</head>

<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <span class="text-primary">🛡️</span> Dashboard
            </a>

            <div class="d-flex align-items-center gap-3">
                <div class="input-group input-group-sm">
                    <span class="input-group-text">MONITORING</span>
                    <select id="targetSelect" class="form-select" style="max-width: 200px;">
                        <option value="" disabled selected>Loading...</option>
                    </select>
                </div>
                <span id="detectionStatus" class="badge rounded-pill bg-secondary px-3 py-2">
                    WAITING...
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-body-secondary text-uppercase small">Packet Rate</h6>
                        <div class="d-flex align-items-baseline">
                            <h2 class="card-title fw-bold text-primary mb-0 me-1" id="hud_pps">0</h2>
                            <span class="small text-body-secondary">pps</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-body-secondary text-uppercase small">Bandwidth</h6>
                        <div class="d-flex align-items-baseline">
                            <h2 class="card-title fw-bold mb-0 me-1" id="hud_bps">0</h2>
                            <span class="small text-body-secondary">bps</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-body-secondary text-uppercase small">Anomaly Score (T0)</h6>
                        <div class="d-flex align-items-baseline">
                            <h2 class="card-title fw-bold text-info mb-0 me-1" id="hud_t0">0.0000</h2>
                            <span class="small text-body-secondary">Norm Distance</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-body-secondary text-uppercase small">Active Flows</h6>
                        <div class="d-flex align-items-baseline">
                            <h2 class="card-title fw-bold mb-0 me-1" id="hud_flows">0</h2>
                            <span class="small text-body-secondary">flows/sec</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h6 class="text-primary text-uppercase fw-bold mb-3 border-start border-primary border-4 ps-2">Anomaly Detection
            Engines</h6>
        <div class="row g-3 mb-4" id="anomalyContainer"></div>

        <h6 class="text-primary text-uppercase fw-bold mb-3 border-start border-primary border-4 ps-2">Traffic
            Volumetrics</h6>
        <div class="row g-3 mb-4" id="volumetricsContainer"></div>

        <h6 class="text-primary text-uppercase fw-bold mb-3 border-start border-primary border-4 ps-2">Attack Vectors
            (TCP/UDP)</h6>
        <div class="row g-3 mb-5" id="vectorsContainer"></div>

    </div>

    <script>
        // ---------------------------------------------------------
        // Configuration
        // ---------------------------------------------------------
        const API_BASE = '/api';
        let currentTarget = null;
        let charts = {};

        // Define chart groups to map to layout sections
        const METRIC_GROUPS = {
            anomaly: [
                { label: 'Tier 0 Distance (Norm)', key: 'tier0_distance_norm', color: '#0dcaf0' }, // Bootstrap Info
                { label: 'Tier 1 Distance (Norm)', key: 'tier1_distance_norm', color: '#6f42c1' }  // Bootstrap Purple
            ],
            volumetrics: [
                { label: 'Packets / Sec', key: 'pps', ewma: 'em_pps', color: '#0d6efd' },       // Bootstrap Primary
                { label: 'Bits / Sec', key: 'bps', ewma: 'em_bps', color: '#6610f2' },          // Bootstrap Indigo
                { label: 'Burst Factor', key: 'burst_factor', ewma: 'em_burst_factor', color: '#ffc107' }, // Bootstrap Warning
                { label: 'Flows / Sec', key: 'fps', ewma: 'em_fps', color: '#d63384' },          // Bootstrap Pink
            ],
            vectors: [
                { label: 'SYN PPS', key: 'syn_pps', ewma: 'em_syn_pps', color: '#dc3545' },       // Bootstrap Danger
                { label: 'SYN-ACK PPS', key: 'synack_pps', ewma: 'em_synack_pps', color: '#fd7e14' }, // Bootstrap Orange
                { label: 'UDP Ratio', key: 'udp', ewma: 'em_udp', color: '#ffc107' },             // Bootstrap Warning
                { label: 'Unique Src IPs', key: 'unique_src_ips', ewma: 'em_unique_src_ips', color: '#198754' } // Bootstrap Success
            ]
        };

        // ---------------------------------------------------------
        // Initialization
        // ---------------------------------------------------------
        async function init() {
            createChartStructure();
            await fetchTargets();
            setInterval(refreshData, 1000);
        }

        // Generate HTML for chart cards
        function createChartStructure() {
            const createCards = (metrics, containerId) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                metrics.forEach(metric => {
                    const colDiv = document.createElement('div');
                    // Use Bootstrap grid classes
                    colDiv.className = 'col-12 col-lg-6 col-xl-3';
                    // Special case for Anomaly charts to be wider (2 per row)
                    if (containerId === 'anomalyContainer') colDiv.className = 'col-12 col-lg-6';

                    colDiv.innerHTML = `
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-header bg-transparent border-0 d-flex align-items-center">
                            <span style="width: 8px; height: 8px; background-color: ${metric.color}; border-radius: 50%; display: inline-block; margin-right: 8px;"></span>
                            <span class="fw-bold small">${metric.label}</span>
                        </div>
                        <div class="card-body p-2">
                            <div style="height: 200px; width: 100%;">
                                <canvas id="chart_${metric.key}"></canvas>
                            </div>
                        </div>
                    </div>
                `;
                    container.appendChild(colDiv);
                });
            };

            createCards(METRIC_GROUPS.anomaly, 'anomalyContainer');
            createCards(METRIC_GROUPS.volumetrics, 'volumetricsContainer');
            createCards(METRIC_GROUPS.vectors, 'vectorsContainer');
        }

        // ---------------------------------------------------------
        // Data Fetching & Updates
        // ---------------------------------------------------------
        async function fetchTargets() {
            try {
                const response = await fetch(`${API_BASE}/targets`);
                const targets = await response.json();
                const select = document.getElementById('targetSelect');

                select.innerHTML = '';

                if (targets.length === 0) {
                    select.add(new Option("No traffic detected", ""));
                    return;
                }

                targets.forEach(ip => {
                    select.add(new Option(ip, ip));
                });

                if (!currentTarget && targets.length > 0) {
                    currentTarget = targets[0];
                    select.value = currentTarget;
                }
            } catch (error) {
                console.error("Target fetch failed", error);
            }
        }

        document.getElementById('targetSelect').addEventListener('change', (e) => {
            currentTarget = e.target.value;
            // Destroy old charts to reset
            Object.values(charts).forEach(c => c.destroy());
            charts = {};
            refreshData();
        });

        async function refreshData() {
            if (!currentTarget) {
                await fetchTargets();
                if (!currentTarget) return;
            }

            try {
                const response = await fetch(`${API_BASE}/stats/${currentTarget}`);
                const data = await response.json();
                if (!data || data.length === 0) return;

                const latest = data[0];
                updateHUD(latest);
                updateCharts(data);

            } catch (error) {
                console.error("Stats fetch failed", error);
            }
        }

        function updateHUD(data) {
            // Formatter for large numbers
            const numFmt = new Intl.NumberFormat('en-US');

            document.getElementById('hud_pps').textContent = numFmt.format(Math.round(data.pps));
            document.getElementById('hud_bps').textContent = formatBytes(data.bps);
            document.getElementById('hud_t0').textContent = (data.tier0_distance_norm || 0).toFixed(4);
            document.getElementById('hud_flows').textContent = numFmt.format(Math.round(data.fps));

            // Update Badge Color based on state
            const statusEl = document.getElementById('detectionStatus');
            const state = data.detection_state || "UNKNOWN";
            statusEl.textContent = state;

            // Remove old color classes
            statusEl.classList.remove('bg-secondary', 'bg-success', 'bg-warning', 'bg-danger');

            if (state === 'NORMAL' || state === 'LEARNING') {
                statusEl.classList.add('bg-success');
            } else if (state === 'SUSPICIOUS') {
                statusEl.classList.add('bg-warning', 'text-dark');
            } else {
                statusEl.classList.add('bg-danger');
            }
        }

        function formatBytes(bits) {
            if (bits === 0) return '0';
            const k = 1000;
            const sizes = ['b', 'Kb', 'Mb', 'Gb'];
            const i = Math.floor(Math.log(bits) / Math.log(k));
            return parseFloat((bits / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function updateCharts(data) {
            const labels = data.map(d => new Date(d.timestamp));

            const allMetrics = [
                ...METRIC_GROUPS.anomaly,
                ...METRIC_GROUPS.volumetrics,
                ...METRIC_GROUPS.vectors
            ];

            allMetrics.forEach(metric => {
                const ctx = document.getElementById(`chart_${metric.key}`);
                if (!ctx) return;

                const rawData = data.map(d => d[metric.key]);
                const ewmaData = metric.ewma ? data.map(d => d[metric.ewma]) : [];

                if (charts[metric.key]) {
                    const chart = charts[metric.key];
                    chart.data.labels = labels;
                    chart.data.datasets[0].data = rawData;
                    if (ewmaData.length > 0 && chart.data.datasets[1]) {
                        chart.data.datasets[1].data = ewmaData;
                    }
                    chart.update('none'); // No animation for performance
                } else {
                    // Initialize Chart
                    const datasets = [{
                        label: 'Current',
                        data: rawData,
                        borderColor: metric.color,
                        backgroundColor: metric.color + '20', // Add transparency for fill
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }];

                    if (metric.ewma) {
                        datasets.push({
                            label: 'Baseline',
                            data: ewmaData,
                            borderColor: '#adb5bd', // Bootstrap Gray-500
                            borderWidth: 1,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            fill: false
                        });
                    }

                    charts[metric.key] = new Chart(ctx, {
                        type: 'line',
                        data: { labels, datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { display: false }, // Clean look
                                tooltip: {
                                    mode: 'index',
                                    intersect: false
                                }
                            },
                            scales: {
                                x: {
                                    type: 'time',
                                    time: { unit: 'second' },
                                    grid: { display: false },
                                    ticks: { display: false }
                                },
                                y: {
                                    beginAtZero: true,
                                    grid: {
                                        color: '#495057' // Darker grid lines for dark mode
                                    },
                                    ticks: {
                                        color: '#adb5bd', // Lighter text for dark mode
                                        font: { size: 10 }
                                    }
                                }
                            }
                        }
                    });
                }
            });
        }

        // Start
        init();

    </script>
</body>

</html>
